[package]
name = "emil"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

[dependencies]
ariadne = "0.6"
indexmap = "2.14"
inkwell = { version = "0.11.0", features = ["llvm23-1", "target-all"] }
lasso = "0.7"
lexical-core = { version = "1.0", features = ["format"] }
logos = "0.16"
slotmap = "1.1"
strum = { version = "0.28", features = ["derive"] }
